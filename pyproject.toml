[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-instagram-gpt"
version = "0.1.0"
description = "A tiny GPT trained on Instagram chat exports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
